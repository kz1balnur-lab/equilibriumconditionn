<!DOCTYPE html>
<html lang="kk" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Иінтіректің тепе-теңдігі: зерттеу · №9 зертханалық жұмыс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ff;--bg2:#ede9fe;--card:#fff;--ink:#1b1033;--ink2:#3b2f5c;--muted:#6b6290;--line:#e4def7;--hot:#ef4d2e;--hot-soft:#fde5df;--cold:#7c3aed;--cold-soft:#ede9fe;--mix:#c026d3;--mix-soft:#fae8ff;--exp:#0f9d58;--exp-soft:#dcf3e6;--warn:#d97706;--warn-soft:#fdf0d7;--accent:#6d28d9;--shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);--stage:#faf8ff;--radius:18px}
[data-theme="dark"]{color-scheme:dark;--bg:#0e0a1c;--bg2:#19132e;--card:#1a1330;--ink:#ece7fb;--ink2:#cfc6ea;--muted:#9a90bd;--line:#2e2552;--hot:#ff6a4d;--hot-soft:#3a1d1a;--cold:#a78bfa;--cold-soft:#2a1f55;--mix:#e879f9;--mix-soft:#3a1a48;--exp:#34c77b;--exp-soft:#11321f;--warn:#f0a53a;--warn-soft:#3a2a10;--accent:#c4b5fd;--shadow:0 10px 30px rgba(0,0,0,.35);--stage:#130e26}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:var(--accent)}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.hero{position:relative;overflow:hidden;background:radial-gradient(1200px 500px at 85% -10%,rgba(232,121,249,.35),transparent 60%),radial-gradient(900px 500px at 0% 120%,rgba(139,92,246,.5),transparent 60%),linear-gradient(135deg,#1e0b3a,#3b1480 55%,#5b21b6);color:#fff;padding:34px 20px 40px}
.hero .wrap{max-width:1180px;margin:0 auto}
.kicker{display:flex;gap:8px;flex-wrap:wrap}
.kicker span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:4px 11px;border-radius:99px;font-size:.78rem;font-weight:600}
.hero h1{font-size:clamp(1.5rem,3.4vw,2.4rem);line-height:1.15;margin:14px 0 10px;font-weight:800;letter-spacing:-.02em;max-width:860px}
.hero .objective{margin:0 0 14px;max-width:780px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-left:4px solid #c4b5fd;font-size:.93rem;line-height:1.5}
.hero .objective b{color:#ddd6fe}
.hero p.sub{opacity:.88;margin:0 0 16px;max-width:700px}
.eq{font:700 1.7rem "JetBrains Mono",monospace;margin:6px 0 16px}.eq .h{color:#f0abfc}.eq .c{color:#c4b5fd}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;font:600 .92rem Inter,sans-serif;cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:#fff;color:#4c1d95}.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn.solid{background:var(--accent);color:var(--bg)}.btn.soft{background:var(--bg2);color:var(--ink)}.btn.small{padding:7px 12px;font-size:.84rem;border-radius:10px}
.chkbtn{background:var(--accent);color:var(--bg);padding:9px 24px}
.layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:26px;padding:24px 18px 80px}
@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}.side{display:none}}
.side{position:sticky;top:18px;align-self:start;max-height:calc(100vh - 36px);overflow-y:auto}
.side nav{display:flex;flex-direction:column;gap:2px;font-size:.88rem}
.side a{color:var(--ink2);text-decoration:none;padding:7px 10px;border-radius:9px;display:flex;gap:9px;align-items:center}
.side a:hover{background:var(--card)}
.side a.on{background:var(--card);color:var(--accent);font-weight:700;box-shadow:var(--shadow)}
.side a b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:7px;background:var(--bg2);font-size:.72rem}
.side a.on b{background:var(--accent);color:var(--bg)}
.side .tools{margin-top:14px;display:flex;flex-direction:column;gap:6px}.side .tools .btn{justify-content:center}
.topnav{display:none;position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:6px 10px}
.topnav a{display:inline-block;padding:6px 10px;font-size:.82rem;color:var(--ink2);text-decoration:none;border-radius:8px}
@media(max-width:1000px){.topnav{display:block}}
section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin:0 0 20px;box-shadow:var(--shadow);scroll-margin-top:70px}
@media(max-width:600px){section.card{padding:18px 16px}}
.sh{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.sh .no{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--mix));color:#fff;font-weight:800;flex:none}
.sh h2{margin:0;font-size:1.25rem;letter-spacing:-.01em}
h3{font-size:1rem;margin:18px 0 8px}p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:.86rem}
.lead{font-size:1.04rem;font-weight:600;border-left:4px solid var(--accent);padding:6px 0 6px 14px;margin:4px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg2);color:var(--ink2)}
.chip.cold{background:var(--cold-soft);color:var(--cold)}.chip.mix{background:var(--mix-soft);color:var(--mix)}.chip.exp{background:var(--exp-soft);color:var(--exp)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.hot{background:var(--hot-soft);color:var(--hot)}
.crit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.crit-grid a{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);font-size:.88rem}
.crit-grid a:hover{border-color:var(--accent);transform:translateY(-1px)}
.crit-grid a i{font-style:normal;flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--cold-soft);color:var(--accent)}
.crit-grid a:hover i{background:var(--accent);color:var(--bg)}
.metarow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}
@media(max-width:700px){.metarow{grid-template-columns:1fr}}
label.l{display:block;font-size:.76rem;color:var(--muted);font-weight:600;margin-bottom:3px}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:500 .9rem Inter,sans-serif}
select{width:auto;font-weight:600}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
.qlist{counter-reset:q;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.qlist li{counter-increment:q;display:flex;gap:12px;align-items:flex-start;font-size:1.04rem;font-weight:600;border-left:4px solid var(--accent);padding:6px 0 6px 14px}
.qlist li::before{content:counter(q);flex:none;width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.tasks{counter-reset:t;list-style:none;margin:8px 0;padding:0;display:grid;gap:8px}
.tasks li{counter-increment:t;display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.tasks li::before{content:counter(t);flex:none;width:26px;height:26px;border-radius:8px;background:var(--bg2);display:grid;place-items:center;font-weight:800;font-size:.82rem}
.tasks li>span:first-child{flex:1}.tasks li .chip{flex:none}
.hyp{border-radius:16px;padding:16px 18px;background:linear-gradient(135deg,var(--warn-soft),transparent 70%);border:1px solid var(--line)}
.hyp .hl{font-size:1.04rem;line-height:2}
.hyp .k{display:inline-block;font-weight:800;padding:0 9px;margin:0 2px;border-radius:8px;border:2px solid currentColor;line-height:1.5}
.hyp .k1{background:var(--cold-soft);color:var(--cold)}.hyp .k2{background:var(--hot-soft);color:var(--hot)}.hyp .k3{background:var(--mix-soft);color:var(--mix)}
.formulas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:10px 0}
.f{background:var(--bg2);border-radius:14px;padding:12px 14px}
.f .t{font-size:.76rem;color:var(--muted);font-weight:600;margin-bottom:2px}
.f .e{font:700 1.02rem "JetBrains Mono",monospace}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 .12em;font-size:.9em}
.frac>span{padding:0 .2em}.frac>span:first-child{border-bottom:1.5px solid currentColor}
.vars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
@media(max-width:600px){.vars{grid-template-columns:1fr}}
.var{border-radius:16px;padding:14px 16px;border:1px solid var(--line)}
.var h4{margin:0 0 8px;font-size:.95rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.var ul{margin:0;padding-left:18px}.var li{margin:3px 0}
.var p.how{margin:10px 0 0;font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.var.v1{background:linear-gradient(180deg,var(--cold-soft),transparent)}.var.v2{background:linear-gradient(180deg,var(--mix-soft),transparent)}.var.v3{background:linear-gradient(180deg,var(--bg2),transparent)}.var.v0{background:linear-gradient(180deg,var(--warn-soft),transparent)}.var.v4{background:linear-gradient(180deg,var(--exp-soft),transparent)}
.note{border-radius:12px;background:var(--cold-soft);padding:10px 12px;font-size:.88rem;margin:10px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.two>*,.lab>*{min-width:0}
.inst{display:grid;gap:8px}
.ins{border-radius:12px;background:var(--bg2);border:1px solid transparent}
.ins.hl,.ins[open]{border-color:var(--accent)}
.ins>summary{list-style:none;display:flex;gap:10px;align-items:center;padding:9px 12px;font-size:.92rem;font-weight:600;cursor:pointer;user-select:none}
.ins>summary::-webkit-details-marker{display:none}
.ins>summary b{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-size:.75rem;flex:none}
.ins>summary span{flex:1}
.ins>summary .chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin:0 4px 4px 0;flex:none}
.ins[open]>summary .chev{transform:rotate(225deg);margin:4px 4px 0 0}
.insb{display:flex;gap:14px;padding:4px 12px 14px;align-items:flex-start}
.insimg{flex:none;width:100px;height:100px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:8px}
.insimg svg{width:72px;height:72px}
.insh{margin:0 0 6px;font-weight:700;font-size:.95rem}
.insb ul{margin:0;padding-left:18px;font-size:.88rem;line-height:1.55}
@media(max-width:520px){.insb{flex-direction:column}}
.scheme{background:var(--stage);border:1px solid var(--line);border-radius:16px;padding:6px}
.scheme .lbl{cursor:pointer}.scheme .lbl circle{fill:var(--accent)}.scheme .lbl text{fill:#fff;font-weight:800;font-size:12px}
.figs{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:16px}
.figbox{display:flex;gap:16px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);flex-wrap:wrap}
.figbox>svg{flex:none;width:300px;max-width:100%;height:auto;background:#fff;border-radius:10px;border:1px solid var(--line)}
.figbox>div{flex:1 1 220px;min-width:0}
.rulerph{flex:none;width:340px;max-width:100%;padding:0;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:zoom-in;position:relative;overflow:hidden;display:block}
.rulerph img{display:block;width:100%;height:auto}
.rulerph span{position:absolute;right:8px;bottom:8px;background:rgba(27,16,51,.78);color:#fff;font:600 .74rem Inter,sans-serif;padding:4px 9px;border-radius:99px;display:inline-flex;gap:5px;align-items:center}
.rulerph:hover{border-color:var(--accent)}.rulerph:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lb{position:fixed;inset:0;z-index:300;background:rgba(10,6,25,.94);display:flex;flex-direction:column}
.lb[hidden]{display:none}
.lbstage{flex:1;min-height:0;overflow:auto;display:flex;padding:20px;cursor:grab;touch-action:none;overscroll-behavior:contain}
.lbstage.drag{cursor:grabbing}
.lbstage img{margin:auto;flex:none;max-width:none;height:auto;border-radius:8px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5);user-select:none;-webkit-user-drag:none;transition:width .15s}
.lbstage.drag img{transition:none}
.lbbar{flex:none;display:flex;justify-content:center;align-items:center;gap:14px;padding:12px 16px;background:#0b0f19;border-top:1px solid rgba(255,255,255,.08)}
.lbbar button{width:56px;height:56px;border-radius:12px;border:0;background:#fff;color:#0b0f19;display:grid;place-items:center;cursor:pointer;transition:transform .12s}
.lbbar button:hover{transform:translateY(-1px)}.lbbar button:disabled{opacity:.4;cursor:default;transform:none}
.lbbar button:focus-visible{outline:3px solid #c4b5fd;outline-offset:2px}
.lbbar .pct{min-width:64px;text-align:center;color:#fff;font:700 1.05rem Inter,sans-serif;background:none;border:0;cursor:pointer}
@media(max-width:520px){.lbbar{gap:8px}.lbbar button{width:46px;height:46px}}
.safety{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;list-style:none;margin:0;padding:0}
.safety li{display:flex;gap:12px;padding:12px 14px;border-radius:14px;background:var(--hot-soft);font-size:.92rem}
.safety li svg{flex:none;width:26px;height:26px}
.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative;padding:0 0 14px 42px}
.steps li::before{content:attr(data-n);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--card);border:2px solid var(--accent);color:var(--accent);font-weight:800;font-size:.8rem;display:grid;place-items:center}
.steps li::after{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li small{display:block;color:var(--muted)}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:8px 0}
.units div{border:1px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:.9rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.9rem}
th,td{padding:8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--bg2);font-weight:700;font-size:.82rem}
tr:last-child td{border-bottom:0}
th.m,td.m{background:var(--mix-soft)}th.x,td.x{background:var(--exp-soft)}th.st,td.st{background:var(--warn-soft)}
td input{width:76px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;text-align:center;font:500 .9rem "JetBrains Mono",monospace;background:var(--card);color:var(--ink)}
td.st input{width:88px}
td input.good{border-color:var(--exp);background:var(--exp-soft);color:var(--exp);font-weight:700}
td input.bad{border-color:var(--hot);background:var(--hot-soft);color:var(--hot);font-weight:700}
td.cv{font-family:"JetBrains Mono",monospace;font-weight:600}td.cv.m{background:var(--mix-soft)}
td.bn{text-align:left;background:var(--card);border-right:1px solid var(--line)}
td.vd{white-space:normal;min-width:120px}
.okc{color:var(--exp);font-weight:700}.badc{color:var(--hot);font-weight:700}.midc{color:var(--warn);font-weight:700}
.ftable td,.ftable th{white-space:normal;text-align:left;vertical-align:top}
.ftable td:first-child{font:700 1rem "JetBrains Mono",monospace;white-space:nowrap;color:var(--accent)}
@media(max-width:600px){.ftable td:first-child{white-space:normal}}
.consts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.consts>div{border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.consts h4{margin:0 0 6px;font-size:.88rem}.consts .agree{background:var(--exp-soft);border-color:transparent}
.prefs{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px}.prefs div{min-width:170px}
.prefs input{font-family:"JetBrains Mono",monospace}
.ex-note{border-radius:12px;background:var(--cold-soft);padding:10px 12px;font-size:.88rem;margin:10px 0}
.tblsel{display:flex;flex-direction:column;gap:6px;margin:14px 0 4px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg2)}
.tblsel>span{font-weight:700;font-size:.88rem}
.tsub{display:flex;gap:10px;align-items:center;margin:10px 0 6px;flex-wrap:wrap}
.tblblock{margin-top:18px}.tblblock>h3:first-child{margin-top:0}
.tblblock>.tnote{margin:-4px 0 6px}
.chkrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.vlab+.tblblock{margin-top:22px}
td select{min-width:92px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:500 .88rem Inter,system-ui,sans-serif}
td select.good{border-color:var(--exp);background:var(--exp-soft);color:var(--exp);font-weight:700}
td select.bad{border-color:var(--hot);background:var(--hot-soft);color:var(--hot);font-weight:700}
th.wr{white-space:normal;min-width:130px}
tr.grp>td{border-top:2px solid var(--line)}
tr.sumrow>td{background:var(--bg2);text-align:left}
.sums{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-weight:600;font-size:.88rem}
.sums label,.sums>span{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.sums label.st input{background:var(--warn-soft)}.sums label.x select{background:var(--exp-soft)}
.stb{display:inline-block;padding:2px 9px;border-radius:99px;font-weight:700;font-size:.8rem;white-space:nowrap;border:1px solid currentColor}
.stb.eq{color:#0f9d58;background:rgba(15,157,88,.08)}.stb.L{color:#7c3aed;background:rgba(124,58,237,.08)}.stb.R{color:#ea580c;background:rgba(234,88,12,.08)}
.score{display:inline-flex;align-items:center;gap:8px;margin-left:8px;font-weight:700;font-size:.9rem}
.pill{display:inline-block;white-space:nowrap;padding:3px 10px;border-radius:99px;font-weight:800;font-size:.82rem}
.pill.ok{background:var(--exp-soft);color:var(--exp)}.pill.mid{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--hot-soft);color:var(--hot)}
/* model */
.stagecard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--stage);margin-bottom:16px}
.stagebar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--card)}
.stagebar .phase{font-weight:700;font-size:.9rem;margin-right:auto;min-width:0;flex:1 1 220px;display:flex;gap:8px;align-items:center}
.stagebar .phase .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--mix);box-shadow:0 0 0 4px var(--mix-soft)}
.play{width:40px;height:40px;border-radius:12px;border:0;background:var(--accent);color:var(--bg);cursor:pointer;display:grid;place-items:center}
.seg{display:inline-flex;background:var(--bg2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 9px;border-radius:8px;font:600 .78rem Inter,sans-serif;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#stage{display:block;width:100%;height:auto;background:var(--stage)}
#stage .tkt{fill:#5b3a1a;font:700 10px "JetBrains Mono",monospace;text-anchor:middle}
#stage .wt2{fill:var(--ink);font:700 13px "JetBrains Mono",monospace;text-anchor:middle}

resN:['Әр нұсқада сол және оң жақтағы барлық жүктердің массасы мен иіндері жазылады (мысалы: 0,1 кг; 0,10 м). «Модель» жолдары модельден автоматты түрде толтырылады, «Нақты тәжірибе» жолдары төмендегі жүктер кестесінен алынады.','Для каждого варианта записываются массы и плечи всех грузов слева и справа (например: 0,1 кг; 0,10 м). Строки «Модель» заполняются из модели автоматически, строки «Реальный опыт» берутся из таблицы грузов ниже.','For each variant the masses and arms of all loads on the left and right are written (for example: 0.1 kg; 0.10 m). The “Model” rows are filled from the model automatically; the “Real experiment” rows come from the load table below.'],
realH:['Нақты тәжірибе: жүктер және күш моменттері','Реальный опыт: грузы и моменты сил','Real experiment: loads and moments of force'],
realN:['Тәжірибені нақты зертханалық иінтіректе қайталап орындаңыз. Әр жүктің жағын таңдап, массасын (кг) және айналу осінен қашықтығын (м) жазыңыз, содан кейін F = m·g және M = F·l есептеңіз. Бағдарлама бұл кестеде ештеңені есептемейді және түзетпейді.','Повторите опыт на настоящем лабораторном рычаге. Для каждого груза выберите сторону, запишите массу (кг) и расстояние до оси (м), затем вычислите F = m·g и M = F·l. Программа в этой таблице ничего не считает и не исправляет.','Repeat the experiment on a real laboratory lever. For each load choose the side, write its mass (kg) and distance from the axis (m), then calculate F = m·g and M = F·l. The program calculates and corrects nothing in this table.'],

calcN:['Сол және оң жақтағы моменттер қосындыларын салыстырыңыз. «Модель» жолдары автоматты түрде есептеледі, «Нақты тәжірибе» жолдарын өзіңіз толтырасыз.','Сравните суммы моментов слева и справа. Строки «Модель» считаются автоматически, строки «Реальный опыт» вы заполняете сами.','Compare the sums of the moments on the left and right. The “Model” rows are calculated automatically; you fill in the “Real experiment” rows yourself.'],

function renderRuler(){
 const alt=L(['0-ден 15 см-ге дейінгі ағаш сызғыш, миллиметрлік бөліктері бар','Деревянная линейка от 0 до 15 см с миллиметровыми делениями','Wooden ruler from 0 to 15 cm with millimetre divisions']);
 $('rulerFig').innerHTML=`<button type="button" class="rulerph" id="rulerPh" title="${esc(L(['Үлкейту','Увеличить','Enlarge']))}"><img src="${RULER_IMG}" alt="${esc(alt)}"><span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/></svg>${L(['Үлкейту','Увеличить','Enlarge'])}</span></button><div><h3 style="margin-top:0">${L(['Сызғыштың бөлік құны','Цена деления линейки','Scale division of the ruler'])}</h3><div class="f"><div class="e">C = ${FR('a − b','n')}</div></div><p class="small">${L(['a мен b шкаладағы цифрмен белгіленген екі көрші сызық, n олардың арасындағы бөліктер саны.','a и b две соседние отметки шкалы с цифрами, n число делений между ними.','a and b are two neighbouring numbered marks, n is the number of divisions between them.'])}</p><div class="f"><div class="t">${L(['Суреттегі сызғыш үшін','Для линейки на рисунке','For the ruler in the picture'])}</div><div class="e">C = ${FR(L(['1 см − 0 см','1 см − 0 см','1 cm − 0 cm']),'10')}<br>= ${L(['0,1 см','0,1 см','0.1 cm'])}</div></div><p class="small">${L(['0 см мен 1 см белгілерінің арасында 10 бөлік бар. Қателігі бөлік құнының жартысы: Δ = 0,05 см. Шкала шегі 15 см.','Между отметками 0 см и 1 см 10 делений. Погрешность равна половине цены деления: Δ = 0,05 см. Предел шкалы 15 см.','There are 10 divisions between the 0 cm and 1 cm marks. The error is half the scale division: Δ = 0.05 cm. The scale limit is 15 cm.'])}</p></div>`;
 $('rulerPh').onclick=()=>openLb(RULER_IMG,alt);}

function armBal(ld,i,g){const me=ld[i-1];if(!me||!me.s||!isFinite(me.m)||!(me.m>0))return NaN;let C=0;

  if(!isFinite(q.m)||!isFinite(q.l))return NaN;C+=(q.s===me.s?-1:1)*g*q.m*q.l}

 else{let v=!pts.length?L(['Графикке әлі нүкте қойылмаған.','На графике ещё нет точек.','There are no points on the graph yet.']):L([`<b>Кестедегі ${R} нүктенің ${okRef}-і графикке дұрыс қойылды.</b> Рұқсат етілген ауытқу: әр ось бойынша шкаланың ±3&nbsp;%.`,`<b>Верно поставлено ${okRef} из ${R} точек таблицы.</b> Допуск: ±3&nbsp;% шкалы по каждой оси.`,`<b>${okRef} of ${R} table points are placed correctly.</b> Tolerance: ±3&nbsp;% of the scale on each axis.`]);

/* ---------- check: runs ONLY when the button is pressed; never edits what the student typed ---------- */
let checked=false;
const decs=raw=>{const s=String(raw).trim().replace(',','.');if(/[e·*×^]/i.test(s))return null;const m=s.match(/\.(\d+)$/);return m?m[1].length:0};
/* the real moments agree when their difference is not larger than what the ruler error alone can give: ΔM = g·Δl·Σm */
const dMOf=ms=>G9()*DL()*ms.reduce((a,m)=>a+(isFinite(m)?m:0),0);
function verify(){
 const g=G9(),res={cells:{},miss:[],any:false,ok:0,all:0,cond:0};
 const addMiss=(tag,names)=>{let e=res.miss.find(x=>x.key===tag[0]);if(!e){e={key:tag[0],tag,names:[]};res.miss.push(e)}names.forEach(n=>{if(!e.names.includes(n))e.names.push(n)})};
 const lack=need=>need.filter(r=>r.ok?!r.ok():!isFinite(tv(r.id))).map(r=>r.name);
 const judge=(id,truths,need,tag)=>{if(!filled(id))return;const tl=truths.filter(isFinite),truth=truths[0];res.any=true;const miss=lack(need);
  if(miss.length||!isFinite(truth)){res.cells[id]='na';addMiss(tag,miss);return}
  res.all++;const s=num(T[id]);if(!isFinite(s)){res.cells[id]='bad';return}
  const d=decs(T[id]),good=tl.some(t=>Math.abs(s-t)<=Math.max(Math.min(d===null?0:0.51*Math.pow(10,-d),0.05*Math.abs(t)),0.01*Math.abs(t),1e-9));res.cells[id]=good?'good':'bad';if(good)res.ok++};
 ACT().forEach(n=>{const tag=[`${n}-нұсқа`,`Вариант ${n}`,`Variant ${n}`],ld=realLoads(n);
  const mm=q=>({id:`r${n}_${q.i}_m`,name:`m (${q.i})`}),ll=q=>({id:`r${n}_${q.i}_l`,name:`l (${q.i})`});
  ld.forEach(q=>{const p=`r${n}_${q.i}_`;judge(p+'F',[q.m*g],[mm(q)],tag);judge(p+'M',[q.m*g*q.l,tv(p+'F')*q.l],[mm(q),ll(q)],tag)});
  const used=ld.filter(q=>q.s||filled(`r${n}_${q.i}_m`)||filled(`r${n}_${q.i}_l`)),sides=used.map(q=>({ok:()=>!!q.s,name:L(['жүк '+q.i+' жағы','сторона груза '+q.i,'side of load '+q.i])}));
  const side=x=>used.filter(q=>q.s===x),data=x=>side(x).flatMap(q=>[mm(q),ll(q)]),truth=x=>side(x).reduce((a,q)=>a+q.m*g*q.l,0),own=x=>side(x).reduce((a,q)=>a+tv(`r${n}_${q.i}_M`),0);
  judge(`r${n}_SL`,[truth('L'),own('L')],sides.concat(data('L')),tag);
  judge(`r${n}_SR`,[truth('R'),own('R')],sides.concat(data('R')),tag);
  const id=`r${n}_ok`;if(filled(id)){res.any=true;const SL=tv(`r${n}_SL`),SR=tv(`r${n}_SR`),miss=lack(used.map(mm));if(!isFinite(SL))miss.unshift('ΣM'+SUBL());if(!isFinite(SR))miss.unshift('ΣM'+SUBR());
   if(miss.length){res.cells[id]='na';addMiss(tag,miss)}else{res.all++;res.cond++;const want=Math.abs(SL-SR)<=dMOf(used.map(q=>q.m))+1e-12?'yes':'no',good=T[id]===want;res.cells[id]=good?'good':'bad';if(good)res.ok++}}});

 $$(CHK_SEL).forEach(el=>el.classList.remove('good','bad'));
 Object.keys(res.cells).forEach(id=>{const el=$(id);if(el&&res.cells[id]!=='na')el.classList.add(res.cells[id])});

 else if(!res.any)h=L(D.chkEmpty);
 if(res.cond)h+=(h?'<br>':'')+L([`«Орындалды ма?» бағаны өз ΣM мәндеріңіз бойынша тексерілді: |ΣM<sub>сол</sub> − ΣM<sub>оң</sub>| ≤ ΔM, ΔM = g·Δl·Σm, Δl = ${fmt(DL(),4)} м.`,`Столбец «Выполнено?» проверен по вашим ΣM: |ΣM<sub>лев</sub> − ΣM<sub>прав</sub>| ≤ ΔM, ΔM = g·Δl·Σm, Δl = ${fmt(DL(),4)} м.`,`The “Met?” column was checked from your own ΣM: |ΣM<sub>left</sub> − ΣM<sub>right</sub>| ≤ ΔM, ΔM = g·Δl·Σm, Δl = ${fmt(DL(),4)} m.`]);
